name: sync-fixtures

on:
  schedule:
    - cron: '0 */6 * * *'   # كل ٦ ساعات
  workflow_dispatch: {}      # تشغيل يدوي من تبويب Actions

permissions:
  contents: read

concurrency:
  group: sync-fixtures
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: مزامنة الإنجليزي/الإسباني/أبطال أوروبا
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/sync.mjs
      - name: مزامنة الدوري السعودي (روشن)
        run: node scripts/sync-saff.mjs
